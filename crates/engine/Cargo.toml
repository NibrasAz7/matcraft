[package]
name = "matcraft_engine"
description = "MatCraft engine: every user-visible behaviour is a command."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Local GGUF inference for `ai.model.load` (candle, via craft-ai's `local`
# feature). Off by default: the dependency tree is heavy; downloads and BYO
# endpoints work without it.
ai-local = ["craft-ai/local"]

[dependencies]
matlang = { path = "../matlang" }
matcore = { path = "../matcore" }
simcraft_engine = { path = "../../../simcraft/crates/engine" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { path = "../../../craft-libs/crates/atomic" }
# AI commands: BYO endpoints, curated model downloads, translation.
craft-ai = { path = "../../../craft-libs/crates/ai" }
# `ai::Kind` derives Serialize/Deserialize.
serde = { version = "1", features = ["derive"] }
