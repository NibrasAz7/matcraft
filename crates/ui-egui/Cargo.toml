[package]
name = "matcraft-ui-egui"
description = "MatCraft Studio user interface (egui): command window, workspace, editor, figure dock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Local GGUF inference for the AI panel (candle). Off by default: the
# dependency tree is heavy; BYO endpoints and model downloads work without it.
ai-local = ["matcraft_engine/ai-local"]

[lib]
name = "matcraft_ui_egui"
path = "src/lib.rs"

[dependencies]
matlang = { path = "../matlang" }
matplot = { path = "../matplot" }
matcraft_engine = { path = "../engine" }
craft-quit = { path = "../../../craft-libs/crates/quit", features = ["egui"] }
craft-settings = { path = "../../../craft-libs/crates/settings" }
egui = "0.36"
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
resvg = "0.45"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { path = "../../../craft-libs/crates/atomic" }
# AI panel: BYO endpoints and curated model downloads (registry rendering).
craft-ai = { path = "../../../craft-libs/crates/ai" }
rfd = "0.17"
