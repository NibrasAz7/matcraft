[package]
name = "matcraft-ui-egui"
description = "MatCraft Studio user interface (egui): command window, workspace, editor, figure dock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "matcraft_ui_egui"
path = "src/lib.rs"

[dependencies]
matlang = { path = "../matlang" }
matplot = { path = "../matplot" }
matcraft_engine = { path = "../engine" }
egui = "0.36"
eframe = "0.36"
serde_json = "1"
base64 = "0.22"
png = "0.18"
resvg = "0.45"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
