[package]
name = "matcore"
description = "MatCraft numerical core: column-major dense matrices and linear algebra."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
faer = { version = "0.24.4", optional = true, default-features = false, features = ["std"] }
dyn-stack = { version = "0.13.2", optional = true, default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[features]
faer = ["dep:faer", "dep:dyn-stack"]
