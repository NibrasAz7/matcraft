[package]
name = "matplot"
description = "MatCraft plotting: figure model and headless SVG renderer."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# PNG encoder for the `<image>` data URIs `to_svg` emits — pure Rust, wasm-safe.
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = "0.45"
flate2 = "1.1"
