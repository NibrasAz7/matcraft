[package]
name = "matcraft-cli"
description = "MatCraft from the command line: eval, run .m files, interactive REPL, command mode, MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "matcraft-cli"
path = "src/main.rs"

[dependencies]
matcraft_engine = { path = "../../crates/engine" }
matcraft_mcp = { path = "../../crates/mcp" }
matlang = { path = "../../crates/matlang" }
serde_json = "1"
