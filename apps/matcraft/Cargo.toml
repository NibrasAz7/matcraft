[package]
name = "matcraft"
description = "MatCraft Studio: command window, workspace, editor and figure dock (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "matcraft"
path = "src/main.rs"

[dependencies]
matcraft-ui-egui = { path = "../../crates/ui-egui" }
egui = "0.36"
eframe = "0.36"
serde_json = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
