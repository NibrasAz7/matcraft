[package]
name = "matcraft-web"
description = "MatCraft L7 WebAssembly browser application (eframe web runner)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "matcraft-web"
path = "src/main.rs"

[dependencies]
matcraft_engine = { path = "../../crates/engine" }
matcraft-ui-egui = { path = "../../crates/ui-egui" }
egui = "0.36"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = "0.36"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
